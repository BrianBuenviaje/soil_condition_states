<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#FFFFFF">
<title>Soil Condition Monitor</title>
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Soil Monitor">
<link rel="stylesheet" href="style.css">
</head>
<body class="bg-canvas font-sans text-ink antialiased">

<div id="preloader" class="fixed inset-0 z-50 flex flex-col items-center justify-center bg-card">
  <img src="logo.png" alt="" class="h-28 w-28 animate-breathe">
  <div class="mt-5 text-base font-semibold tracking-tight">Soil Condition Monitor</div>
  <div class="mt-4 h-1 w-40 overflow-hidden rounded-full bg-empty">
    <div class="h-full w-2/5 animate-slide rounded-full bg-brand"></div>
  </div>
  <div class="mt-3 text-xs text-dim">Loading the recorded readings</div>
</div>

<div class="mx-auto flex min-h-screen max-w-md flex-col bg-canvas sm:border-x sm:border-line">
  <header class="sticky top-0 z-20 border-b border-line bg-card/95 backdrop-blur">
    <div class="flex items-center gap-2.5 px-4 pb-2 pt-3">
      <img src="logo.png" alt="" class="h-9 w-9 shrink-0">
      <div class="min-w-0 flex-1">
        <h1 class="truncate text-[15px] font-semibold leading-tight tracking-tight">Soil Condition Monitor</h1>
        <div id="meta" class="truncate text-[11px] text-dim"></div>
      </div>
      <span class="inline-flex shrink-0 items-center gap-1 rounded-full border border-clay/30 bg-clay/10 px-2 py-0.5 text-[11px] font-medium text-clay" id="replayTag"></span>
    </div>
    <div class="px-4 pb-3">
      <div class="flex items-baseline justify-between">
        <span class="text-[10px] font-semibold uppercase tracking-[0.12em] text-dim">Showing</span>
        <span id="now" class="font-mono text-[13px] font-medium"></span>
      </div>
      <div class="mt-2 flex items-center gap-1.5">
        <button data-step="-24" aria-label="Back one day"></button>
        <button data-step="-1" aria-label="Back one hour"></button>
        <input type="range" id="slider" class="scrubber mx-1.5 flex-1" min="0" max="0" value="0" aria-label="Time">
        <button data-step="1" aria-label="Forward one hour"></button>
        <button data-step="24" aria-label="Forward one day"></button>
      </div>
    </div>
  </header>

  <main id="view" class="flex-1 px-4 pb-28 pt-4"></main>

  <nav id="tabs" class="fixed bottom-0 left-1/2 z-20 grid w-full max-w-md -translate-x-1/2 grid-cols-4 border-t border-line bg-card/95 pb-[env(safe-area-inset-bottom)] backdrop-blur sm:border-x"></nav>
</div>

<script src="data.js"></script>
<script src="config.js"></script>
<script src="engine.js"></script>
<script src="simulator.js"></script>
<script src="live.js"></script>
<script src="app.js"></script>
</body>
</html>
